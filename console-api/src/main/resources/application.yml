spring:
  application:
    name: sigdep-console-api
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5436/sigdep}
    username: ${SPRING_DATASOURCE_USERNAME:sigdep}
    password: ${SPRING_DATASOURCE_PASSWORD:sigdep}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: core
  liquibase:
    enabled: false
  cache:
    type: caffeine
    # Tight TTL so dashboard / public-KPI consumers see fresh data within
    # ~30s of an ingest, without paying the full SQL cost on every reload.
    # Per-cache override is possible via `caffeine.spec` on a specific cache.
    caffeine:
      spec: maximumSize=2000,expireAfterWrite=60s
app:
  jwt:
    # Clé symétrique HS256 — DOIT faire >= 32 octets. En prod, fournir
    # SIGDEP_JWT_SECRET via .env (jamais committée). Le défaut ci-dessous
    # n'est là que pour le dev local.
    secret: ${SIGDEP_JWT_SECRET:dev-only-insecure-secret-change-me-32bytes-minimum!!}
    issuer: ${SIGDEP_JWT_ISSUER:sigdep-hub}
    access-ttl: ${SIGDEP_JWT_ACCESS_TTL:PT1H}
    refresh-ttl: ${SIGDEP_JWT_REFRESH_TTL:P7D}
  admin:
    # SUPER_ADMIN seedé au 1er boot si la table auth.users est vide.
    email: ${SIGDEP_ADMIN_EMAIL:}
    password: ${SIGDEP_ADMIN_PASSWORD:}
    display-name: ${SIGDEP_ADMIN_NAME:Administrateur SIGDEP}
  # NB v2.0 : Keycloak est en cours de retrait (PR4). Tant que
  # KeycloakAdminService/UsersController existent, ce bloc reste requis au boot.
  keycloak:
    server-url: ${KEYCLOAK_SERVER_URL:http://localhost:8180}
    realm: ${KEYCLOAK_REALM:sigdep}
    admin-client-id: ${KEYCLOAK_ADMIN_CLIENT_ID:sigdep-console-admin}
    admin-client-secret: ${KEYCLOAK_ADMIN_CLIENT_SECRET:console-admin-dev-secret-change-me}
  web:
    resources:
      static-locations: classpath:/static/

server:
  port: ${SERVER_PORT:8041}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
