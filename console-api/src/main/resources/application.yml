spring:
  application:
    name: sigdep-console-api
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5436/sigdep}
    username: ${SPRING_DATASOURCE_USERNAME:sigdep}
    password: ${SPRING_DATASOURCE_PASSWORD:sigdep}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: core
  liquibase:
    enabled: false
  cache:
    type: caffeine
    # Tight TTL so dashboard / public-KPI consumers see fresh data within
    # ~30s of an ingest, without paying the full SQL cost on every reload.
    # Per-cache override is possible via `caffeine.spec` on a specific cache.
    caffeine:
      spec: maximumSize=2000,expireAfterWrite=60s
  # SMTP — utilisé seulement quand app.mail.enabled=true. Sinon les emails
  # sont logués en console (dev). Renseigner via SIGDEP_MAIL_* (.env).
  mail:
    host: ${SIGDEP_MAIL_HOST:localhost}
    port: ${SIGDEP_MAIL_PORT:587}
    username: ${SIGDEP_MAIL_USERNAME:}
    password: ${SIGDEP_MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${SIGDEP_MAIL_SMTP_AUTH:true}
          # STARTTLS (port 587, défaut) — passer à false si SSL implicite.
          starttls:
            enable: ${SIGDEP_MAIL_STARTTLS:true}
          # SSL implicite (port 465) — mettre SIGDEP_MAIL_SSL=true et
          # SIGDEP_MAIL_STARTTLS=false pour les serveurs type cPanel.
          ssl:
            enable: ${SIGDEP_MAIL_SSL:false}
            # Au besoin, faire confiance au certificat du serveur SMTP
            # (ex. certificat auto-signé d'un relais mutualisé) : y mettre
            # le host SMTP, ou "*" pour tout accepter.
            trust: ${SIGDEP_MAIL_SSL_TRUST:}
app:
  jwt:
    # Clé symétrique HS256 — DOIT faire >= 32 octets. En prod, fournir
    # SIGDEP_JWT_SECRET via .env (jamais committée). Le défaut ci-dessous
    # n'est là que pour le dev local.
    secret: ${SIGDEP_JWT_SECRET:dev-only-insecure-secret-change-me-32bytes-minimum!!}
    issuer: ${SIGDEP_JWT_ISSUER:sigdep-hub}
    access-ttl: ${SIGDEP_JWT_ACCESS_TTL:PT1H}
    refresh-ttl: ${SIGDEP_JWT_REFRESH_TTL:P7D}
  # Comptes d'administration seedés au démarrage (AdminSeeder), idempotents
  # par email. En prod, surcharger via le .env ET CHANGER les mots de passe
  # par défaut. Laisser un mot de passe vide désactive le seed de ce compte.
  admin:
    email: ${SIGDEP_ADMIN_EMAIL:admin@sigdep.ci}
    password: ${SIGDEP_ADMIN_PASSWORD:ChangeMe2026!}
    display-name: ${SIGDEP_ADMIN_NAME:Super Administrateur SIGDEP}
  it-admin:
    email: ${SIGDEP_IT_ADMIN_EMAIL:it-admin@sigdep.ci}
    password: ${SIGDEP_IT_ADMIN_PASSWORD:ChangeMe2026!}
    display-name: ${SIGDEP_IT_ADMIN_NAME:Administrateur Technique SIGDEP}
  # URL publique du front, utilisée pour construire les liens dans les emails
  # (réinitialisation / définition de mot de passe).
  public-url: ${SIGDEP_PUBLIC_URL:http://localhost:9000}
  # SSO Superset (« Analyses avancées ») par cookie de domaine parent : au
  # login, console-api pose un cookie JWT lisible par le sous-domaine Superset.
  # nginx (vhost analytics) le vérifie via /api/auth/verify (auth_request) et
  # injecte l'identité → Superset connecte l'utilisateur sans re-login.
  sso:
    # Domaine du cookie : DOIT être le domaine parent commun à la console et à
    # Superset (ex. .sigdep.example.org pour sigdep.* + analytics.*). En dev,
    # localhost couvre localhost + analytics.localhost. Vide → cookie sans
    # Domain (même hôte uniquement, donc SSO inactif vers le sous-domaine).
    cookie-domain: ${SIGDEP_SSO_COOKIE_DOMAIN:localhost}
    # Cookie Secure (HTTPS only). true en prod ; false en dev (http://localhost).
    cookie-secure: ${SIGDEP_SSO_COOKIE_SECURE:false}
  # Origines CORS autorisées (liste séparée par des virgules). Référence
  # explicite à APP_CORS_ALLOWED_ORIGINS : sans cette ligne, spring-dotenv
  # n'applique pas le relaxed binding APP_* → app.* sur un @Value.
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:9000,http://127.0.0.1:9000,http://localhost:5173,http://127.0.0.1:5173,http://localhost:8041,http://127.0.0.1:8041}
  mail:
    # false (défaut) → les emails sont LOGUÉS en console au lieu d'être
    # envoyés. Passer à true une fois le SMTP (spring.mail.*) configuré.
    enabled: ${SIGDEP_MAIL_ENABLED:false}
    from: ${SIGDEP_MAIL_FROM:SIGDEP-3 <no-reply@sigdep.ci>}
    # TTL des liens : reset court, définition initiale (bienvenue) plus long.
    reset-ttl: ${SIGDEP_MAIL_RESET_TTL:PT1H}
    welcome-ttl: ${SIGDEP_MAIL_WELCOME_TTL:PT72H}
  web:
    resources:
      static-locations: classpath:/static/

server:
  port: ${SERVER_PORT:8041}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  health:
    # Le mailHealthIndicator teste le SMTP à CHAQUE /actuator/health. Un SMTP
    # externe injoignable (ou trust manquant) rendrait alors l'API « DOWN » →
    # conteneur unhealthy → blocage du déploiement, alors que l'API fonctionne.
    # On exclut donc le mail de la santé : l'envoi reste best-effort côté code.
    mail:
      enabled: false
