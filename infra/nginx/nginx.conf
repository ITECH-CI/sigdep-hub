# Dev reverse-proxy: a single origin (http://localhost:9000) that fronts the
# SPA (Vite) and the console-api. Reproducing the prod topology in dev keeps
# the URLs identical to what users will see in production. Auth v2.0 is JWT
# (plus de Keycloak/OIDC) ; rien à proxifier côté serveur d'identité.

worker_processes  auto;
events { worker_connections 1024; }

http {
    sendfile        on;
    keepalive_timeout 65;

    # WebSocket upgrade map (used for Vite HMR).
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent"';

    upstream vite        { server host.docker.internal:5173; }
    upstream console_api { server host.docker.internal:8041; }

    server {
        listen 80 default_server;
        server_name _;
        client_max_body_size 50m;

        # Garder les redirections (Location) RELATIVES : sinon nginx forge un
        # URL absolu avec le port d'écoute (:80) et casse l'accès dev sur :9000.
        absolute_redirect off;

        # Forward proxy info to upstreams so Spring sees the original
        # host/scheme.
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  $server_port;

        # ---- Console API ----------------------------------------------
        location /api/       { proxy_pass http://console_api; }
        location /actuator/  { proxy_pass http://console_api; }

        # ---- Superset (« Analyses avancées », optionnel en dev) -------
        # Superset sert à la racine (l'image ignore SUPERSET_APP_ROOT). nginx
        # strippe /analytics/ (slash final du proxy_pass) et pose
        # X-Forwarded-Prefix ; ProxyFix (x_prefix) repréfixe alors la plupart
        # des URLs. host.docker.internal vient de extra_hosts → toujours
        # résoluble (pas de Superset → 502, pas de redirection vers la landing).
        location /analytics/ {
            # Slash final → strippe /analytics/ (Superset sert à la racine).
            proxy_pass http://host.docker.internal:8088/;
            proxy_set_header Host               $host;
            proxy_set_header X-Real-IP          $remote_addr;
            proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto  $scheme;
            # ProxyFix (x_prefix) repréfixe les URLs générées par Superset.
            proxy_set_header X-Forwarded-Prefix /analytics;
            # Filet de sécurité : certaines redirections de Superset (ex.
            # /analytics/ → /superset/welcome/ quand non authentifié) sortent
            # sans préfixe ; sans ça elles tombent dans le fallback SPA
            # (landing). On repréfixe tout Location qui n'est pas déjà /analytics.
            proxy_redirect ~^/(?!analytics/)(.*)$ /analytics/$1;
        }

        # ---- Vite dev server (SPA + HMR) ------------------------------
        # WebSocket upgrade is required so Vite can push HMR updates.
        # Note: nginx resets ALL inherited proxy_set_header values as soon
        # as one new proxy_set_header is declared inside a block, so we
        # restate Host and X-Forwarded-* here too.
        location / {
            proxy_pass http://vite;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host  $host;
            proxy_set_header X-Forwarded-Port  $server_port;
            proxy_set_header Upgrade           $http_upgrade;
            proxy_set_header Connection        $connection_upgrade;
            proxy_read_timeout                 86400;
        }
    }
}
