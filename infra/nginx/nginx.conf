# Dev reverse-proxy: a single origin (http://localhost:9000) that fronts the
# SPA (Vite) and the console-api. Reproducing the prod topology in dev keeps
# the URLs identical to what users will see in production. Auth v2.0 is JWT
# (plus de Keycloak/OIDC) ; rien à proxifier côté serveur d'identité.

worker_processes  auto;
events { worker_connections 1024; }

http {
    sendfile        on;
    keepalive_timeout 65;

    # WebSocket upgrade map (used for Vite HMR).
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent"';

    upstream vite        { server host.docker.internal:5173; }
    upstream console_api { server host.docker.internal:8041; }
    upstream superset    { server host.docker.internal:8088; }

    # ===== Console (SPA + console-api) — http://localhost:9000 =============
    server {
        listen 80 default_server;
        server_name _;
        client_max_body_size 50m;

        # Forward proxy info to upstreams so Spring sees the original
        # host/scheme.
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  $server_port;

        # ---- Console API ----------------------------------------------
        location /api/       { proxy_pass http://console_api; }
        location /actuator/  { proxy_pass http://console_api; }

        # ---- Vite dev server (SPA + HMR) ------------------------------
        # WebSocket upgrade is required so Vite can push HMR updates.
        # Note: nginx resets ALL inherited proxy_set_header values as soon
        # as one new proxy_set_header is declared inside a block, so we
        # restate Host and X-Forwarded-* here too.
        location / {
            proxy_pass http://vite;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host  $host;
            proxy_set_header X-Forwarded-Port  $server_port;
            proxy_set_header Upgrade           $http_upgrade;
            proxy_set_header Connection        $connection_upgrade;
            proxy_read_timeout                 86400;
        }
    }

    # ===== Superset (« Analyses avancées ») — http://analytics.localhost:9000
    # Vhost DÉDIÉ : Superset sert à la RACINE, donc /api, /static, /login lui
    # appartiennent — aucune collision avec la console, aucune réécriture de
    # préfixe. (analytics.localhost résout vers 127.0.0.1 sur macOS/navigateurs.)
    server {
        listen 80;
        server_name analytics.localhost;
        client_max_body_size 50m;

        # SSO : vérifie l'identité auprès de console-api (lit le cookie
        # sigdep_sso). Sous-requête interne, non exposée. 200 → headers
        # d'identité ; 401 → l'utilisateur tombe sur le login Superset.
        location = /sso-auth {
            internal;
            proxy_pass http://console_api/api/auth/verify;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header Host       $http_host;
            proxy_set_header Cookie     $http_cookie;   # transmet sigdep_sso
        }

        location / {
            # Vérifie le cookie SSO ; si absent/invalide (401), on n'échoue PAS
            # la requête (error_page 401 = @superset_anon) pour laisser Superset
            # afficher son propre login.
            auth_request /sso-auth;
            auth_request_set $sso_user $upstream_http_x_remote_user;
            auth_request_set $sso_role $upstream_http_x_remote_role;
            error_page 401 = @superset_anon;

            proxy_pass http://superset;
            proxy_set_header Host              $http_host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host  $http_host;
            # Identité SSO injectée pour Superset (AUTH_REMOTE_USER). On écrase
            # toute valeur entrante (anti-forge : seul nginx peut la poser).
            proxy_set_header X-Remote-User $sso_user;
            proxy_set_header X-Remote-Role $sso_role;
        }

        # Utilisateur non authentifié console : on passe à Superset SANS
        # identité → il affichera son login séparé.
        location @superset_anon {
            proxy_pass http://superset;
            proxy_set_header Host              $http_host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host  $http_host;
            proxy_set_header X-Remote-User "";
            proxy_set_header X-Remote-Role "";
        }
    }
}
