# Production reverse-proxy. Mirrors the dev config (same routes, same path
# prefixes) but adds TLS termination and serves the SPA from a built bundle
# instead of forwarding to Vite.

worker_processes  auto;
events { worker_connections 2048; }

http {
    sendfile        on;
    keepalive_timeout 65;
    server_tokens   off;
    client_max_body_size 50m;

    # Domaine de la console déduit du host analytics (analytics.X → X), pour
    # rediriger un utilisateur non connecté du SSO vers le login console.
    map $host $console_host {
        ~^analytics\.(?<rest>.+)$  $rest;
        default                    $host;
    }

    upstream console_api   { server console-api:8041; }
    upstream ingestion_api { server ingestion-api:8090; }
    upstream console_web   { server console-web:80; }
    # NB : pas d'upstream statique pour Superset. Un bloc `upstream` (ou un
    # proxy_pass vers un nom littéral) est résolu au DÉMARRAGE de nginx ; si
    # le conteneur superset n'est pas déployé, nginx refuse de démarrer
    # (« host not found in upstream »). On résout donc le nom à la requête
    # via le resolver Docker + une variable dans proxy_pass (cf. /analytics/).

    # Force HTTP → HTTPS at the edge.
    server {
        listen 80 default_server;
        server_name _;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        http2  on;
        server_name _;

        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 10m;

        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  443;

        # Buffers généreux : les réponses JWT + en-têtes d'auth peuvent
        # dépasser les valeurs par défaut et déclencher des 502
        # « upstream sent too big header ».
        proxy_buffer_size       16k;
        proxy_buffers           8 16k;
        proxy_busy_buffers_size 32k;

        # ---- Ingestion API (agents talk to this directly) --------------
        location /api/v1/sync/ { proxy_pass http://ingestion_api; }

        # ---- Console API ------------------------------------------------
        location /api/       { proxy_pass http://console_api; }
        location /actuator/  { proxy_pass http://console_api; }

        # Superset n'est PAS servi ici : il a son propre vhost dédié
        # (server_name analytics.<host>, plus bas) pour éviter les collisions
        # de routes (/api, /static, /login) avec la console.

        # ---- SPA (servie par le conteneur console-web) -----------------
        # Le conteneur console-web embarque le bundle Vite + sa propre
        # config nginx (history fallback, cache des /assets/). On le
        # traite ici comme n'importe quel upstream HTTP interne.
        location / {
            proxy_pass http://console_web;
        }
    }

    # ===== Superset (« Analyses avancées ») — vhost dédié ==================
    # Superset sert à la RACINE de ce host : /api, /static, /login lui
    # appartiennent → aucune collision avec la console, aucune réécriture.
    #
    # PRÉREQUIS DÉPLOIEMENT :
    #   - DNS : analytics.<votre-domaine> → même IP que le hub.
    #   - TLS : le certificat doit couvrir analytics.<domaine> (SAN ou wildcard).
    #   - VITE_SUPERSET_URL (build console-web) = https://analytics.<domaine>/
    # Si Superset n'est pas déployé, ce server renvoie 502 (résolution
    # paresseuse via variable + resolver Docker) sans empêcher nginx de démarrer.
    server {
        listen 443 ssl;
        http2  on;
        # ADAPTER au domaine réel (ex. analytics.sigdep.example.org).
        server_name analytics.*;

        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        client_max_body_size 50m;

        # SSO : vérifie le cookie sigdep_sso auprès de console-api. Sous-requête
        # interne. 200 → en-têtes d'identité ; 401 → @superset_anon (login).
        location = /sso-auth {
            internal;
            proxy_pass http://console_api/api/auth/verify;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header Host       $http_host;
            proxy_set_header Cookie     $http_cookie;   # transmet sigdep_sso
        }

        # Assets statiques : PAS d'auth_request (sinon, non connecté, ils
        # seraient redirigés vers le login → page cassée).
        location /static/ {
            resolver 127.0.0.11 valid=30s;
            set $superset_upstream http://superset:8088;
            proxy_pass $superset_upstream;
            proxy_set_header Host              $http_host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Host  $http_host;
        }

        location / {
            # Vérifie le cookie SSO. 401 (non connecté) → @superset_anon
            # redirige vers le login console (Superset est en AUTH_REMOTE_USER,
            # sans formulaire propre → sinon boucle).
            auth_request /sso-auth;
            auth_request_set $sso_user $upstream_http_x_remote_user;
            auth_request_set $sso_role $upstream_http_x_remote_role;
            error_page 401 = @superset_anon;

            resolver 127.0.0.11 valid=30s;   # DNS interne Docker (lazy resolve)
            set $superset_upstream http://superset:8088;
            proxy_pass $superset_upstream;
            proxy_set_header Host              $http_host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Host  $http_host;
            # Identité SSO injectée pour Superset (AUTH_REMOTE_USER). On écrase
            # toute valeur entrante (anti-forge : seul nginx peut la poser).
            proxy_set_header X-Remote-User $sso_user;
            proxy_set_header X-Remote-Role $sso_role;
            proxy_buffer_size       16k;
            proxy_buffers           8 16k;
            proxy_busy_buffers_size 32k;
        }

        # Non connecté à la console → on l'envoie s'y authentifier ; il
        # reviendra ensuite sur l'analytics avec le cookie SSO.
        location @superset_anon {
            return 302 https://$console_host/login;
        }
    }
}
