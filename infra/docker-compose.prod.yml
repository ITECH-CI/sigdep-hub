# SIGDEP-3 hub — production-leaning compose. Reproduces the dev topology
# (single nginx origin in front of the consolidated APIs) but with TLS and
# real DB credentials. Auth v2.0 : Spring Security + JWT HS256, plus de
# Keycloak.
#
# DO NOT use this file as-is in production: it is a working skeleton that
# encodes the topology and config knobs. Before going live, replace every
# `change-me` placeholder, mount real TLS certs (Let's Encrypt or org PKI),
# put Postgres on managed storage, and pin image digests instead of tags.
#
# Usage (staging or local TLS verification):
#   docker compose -f docker-compose.prod.yml up

services:
  postgres:
    image: postgres:16
    container_name: sigdep-postgres
    environment:
      POSTGRES_DB:       ${POSTGRES_DB:-sigdep}
      POSTGRES_USER:     ${POSTGRES_USER:-sigdep}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      # Rôle lecture seule pour Superset, créé au 1er boot (si mot de passe fourni).
      SUPERSET_DB_READONLY_USER:     ${SUPERSET_DB_READONLY_USER:-superset_ro}
      SUPERSET_DB_READONLY_PASSWORD: ${SUPERSET_DB_READONLY_PASSWORD:-}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Script init exécuté UNE FOIS au premier boot (volume vierge).
      - ./postgres/01-init-superset-readonly.sh:/docker-entrypoint-initdb.d/01-init-superset-readonly.sh:ro
    # No host port exposed in prod — DB is reached over the compose network.

  console-api:
    # Replace with the actual published image (e.g. ghcr.io/itechciv/sigdep-console-api:<tag>).
    image: ${CONSOLE_API_IMAGE:-sigdep-console-api:latest}
    container_name: sigdep-console-api
    environment:
      SPRING_DATASOURCE_URL:           jdbc:postgresql://postgres:5432/${POSTGRES_DB:-sigdep}
      SPRING_DATASOURCE_USERNAME:      ${POSTGRES_USER:-sigdep}
      SPRING_DATASOURCE_PASSWORD:      ${POSTGRES_PASSWORD:-change-me}
      # Auth v2.0 : clé de signature JWT (>= 32 octets) + seed des comptes
      # d'administration au premier boot (SUPER_ADMIN + IT_ADMIN).
      SIGDEP_JWT_SECRET:               ${SIGDEP_JWT_SECRET:-change-me-32-bytes-minimum-secret!!}
      SIGDEP_ADMIN_EMAIL:              ${SIGDEP_ADMIN_EMAIL:-}
      SIGDEP_ADMIN_PASSWORD:           ${SIGDEP_ADMIN_PASSWORD:-}
      SIGDEP_IT_ADMIN_EMAIL:           ${SIGDEP_IT_ADMIN_EMAIL:-}
      SIGDEP_IT_ADMIN_PASSWORD:        ${SIGDEP_IT_ADMIN_PASSWORD:-}
      APP_CORS_ALLOWED_ORIGINS:        ${PUBLIC_ORIGIN:-https://sigdep.example.org}
      # Base des liens dans les emails (mêmes valeur que l'origine publique).
      SIGDEP_PUBLIC_URL:               ${PUBLIC_ORIGIN:-https://sigdep.example.org}
      # Emails transactionnels (désactivés par défaut → logués).
      SIGDEP_MAIL_ENABLED:             ${SIGDEP_MAIL_ENABLED:-false}
      SIGDEP_MAIL_FROM:                ${SIGDEP_MAIL_FROM:-SIGDEP-3 <no-reply@sigdep.example.org>}
      SIGDEP_MAIL_HOST:                ${SIGDEP_MAIL_HOST:-}
      SIGDEP_MAIL_PORT:                ${SIGDEP_MAIL_PORT:-587}
      SIGDEP_MAIL_USERNAME:            ${SIGDEP_MAIL_USERNAME:-}
      SIGDEP_MAIL_PASSWORD:            ${SIGDEP_MAIL_PASSWORD:-}
      # Chiffrement : STARTTLS (587, défaut) ou SSL implicite (465).
      SIGDEP_MAIL_STARTTLS:            ${SIGDEP_MAIL_STARTTLS:-true}
      SIGDEP_MAIL_SSL:                 ${SIGDEP_MAIL_SSL:-false}
    depends_on: [postgres]

  ingestion-api:
    image: ${INGESTION_API_IMAGE:-sigdep-ingestion-api:latest}
    container_name: sigdep-ingestion-api
    environment:
      SPRING_DATASOURCE_URL:      jdbc:postgresql://postgres:5432/${POSTGRES_DB:-sigdep}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-sigdep}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    depends_on: [postgres]

  console-web:
    # Sert le bundle Vite + sa propre config nginx (history fallback,
    # cache /assets/). Le nginx front (ci-dessous) fait le reverse-proxy.
    image: ${CONSOLE_WEB_IMAGE:-sigdep-console-web:latest}
    container_name: sigdep-console-web
    # Pas de port host exposé : le nginx front est seul à sortir sur
    # 443. console-web ne répond qu'au réseau interne du compose.

  # Apache Superset — « Analyses avancées ». Login séparé (pas de SSO en
  # phase 1). Métadonnées Superset persistées dans un volume (SQLite par
  # défaut). À connecter à la base SIGDEP via le rôle lecture seule
  # superset_ro (URI : postgresql://superset_ro:<pwd>@postgres:5432/sigdep).
  superset:
    image: apache/superset:4.1.1
    container_name: sigdep-superset
    environment:
      # Clé secrète Superset — OBLIGATOIRE, à générer (openssl rand -base64 42).
      SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY:-change-me-superset-secret-key}
      # Compte admin Superset créé au 1er boot.
      SUPERSET_ADMIN_USERNAME: ${SUPERSET_ADMIN_USERNAME:-admin}
      SUPERSET_ADMIN_PASSWORD: ${SUPERSET_ADMIN_PASSWORD:-admin}
      SUPERSET_ADMIN_EMAIL:    ${SUPERSET_ADMIN_EMAIL:-admin@sigdep.example.org}
      # Servi derrière nginx sous le sous-chemin /analytics (cf. nginx.prod.conf).
      SUPERSET_APP_ROOT:       /analytics
      ENABLE_PROXY_FIX:        "true"
    # Bootstrap : upgrade DB métadonnées + crée l'admin + init rôles, puis lance.
    command: >
      bash -c "
      superset db upgrade &&
      superset fab create-admin
        --username \"$${SUPERSET_ADMIN_USERNAME}\"
        --firstname Admin --lastname SIGDEP
        --email \"$${SUPERSET_ADMIN_EMAIL}\"
        --password \"$${SUPERSET_ADMIN_PASSWORD}\" || true &&
      superset init &&
      gunicorn --bind 0.0.0.0:8088 --workers 4 --timeout 120 'superset.app:create_app()'
      "
    volumes:
      - superset_home:/app/superset_home
    depends_on: [postgres]
    # Pas de port host exposé : le nginx front route /analytics/ → superset:8088.

  nginx:
    image: nginx:1.27-alpine
    container_name: sigdep-nginx
    depends_on: [console-api, ingestion-api, console-web]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.prod.conf:/etc/nginx/nginx.conf:ro
      # Monter ici un vrai certificat TLS. Pour staging, un certificat
      # mkcert fait l'affaire.
      - ./nginx/certs:/etc/nginx/certs:ro

volumes:
  postgres_data:
  superset_home:
