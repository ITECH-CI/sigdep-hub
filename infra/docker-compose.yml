services:
  postgres:
    image: postgres:16
    container_name: sigdep-postgres
    environment:
      POSTGRES_DB: sigdep
      POSTGRES_USER: sigdep
      POSTGRES_PASSWORD: sigdep
    ports:
      - "5436:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  nginx:
    image: nginx:1.27-alpine
    container_name: sigdep-nginx
    ports:
      - "9000:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    extra_hosts:
      # Make host.docker.internal resolvable on Linux (already works on
      # Docker Desktop for Mac/Windows).
      - "host.docker.internal:host-gateway"

  # Apache Superset — « Analyses avancées » en dev. Optionnel : démarrer
  # explicitement avec `docker compose up -d superset` (le profil l'exclut
  # du `up` par défaut, car il est lourd à booter). Le port 8088 est exposé
  # sur l'hôte pour que le nginx dev l'atteigne via host.docker.internal:8088
  # (cf. location /analytics/ dans nginx.conf). Login séparé (pas de SSO).
  superset:
    image: apache/superset:4.1.1
    container_name: sigdep-superset
    profiles: ["analytics"]
    ports:
      - "8088:8088"
    environment:
      # En dev, une clé fixe suffit (NE PAS réutiliser en prod).
      SUPERSET_SECRET_KEY: dev-only-superset-secret-key-change-in-prod
      SUPERSET_ADMIN_USERNAME: admin
      SUPERSET_ADMIN_PASSWORD: admin
      SUPERSET_ADMIN_EMAIL:    admin@sigdep.local
      # Servi sous /analytics par le nginx dev (mêmes URLs qu'en prod). Le
      # sous-chemin est géré par superset_config.py (X-Forwarded-Prefix) ;
      # SUPERSET_APP_ROOT est ignoré par l'image 4.1.x, on ne s'en sert pas.
      SUPERSET_CONFIG_PATH:    /app/pythonpath/superset_config.py
    # Un seul appel bash -c. Chaque commande tient sur UNE ligne logique :
    # create-admin doit rester d'un bloc (sinon bash lit « --username » comme
    # une commande → « command not found » et l'admin n'est jamais créé).
    command:
      - bash
      - -c
      - |
        superset db upgrade &&
        (superset fab create-admin --username "$${SUPERSET_ADMIN_USERNAME}" --firstname Admin --lastname SIGDEP --email "$${SUPERSET_ADMIN_EMAIL}" --password "$${SUPERSET_ADMIN_PASSWORD}" || true) &&
        superset init &&
        gunicorn --bind 0.0.0.0:8088 --workers 2 --timeout 120 'superset.app:create_app()'
    volumes:
      - superset_home:/app/superset_home
      # Config Superset (sous-chemin /analytics via X-Forwarded-Prefix).
      - ./superset/superset_config.py:/app/pythonpath/superset_config.py:ro

volumes:
  postgres_data:
  superset_home:
